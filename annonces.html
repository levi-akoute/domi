<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B3B35" />
    <title>Annonces de logements — Domi</title>
    <meta
      name="description"
      content="Domi : annonces de logements examinées avant publication, propriétaires identifiés et contact direct en Côte d’Ivoire."
    />
    <meta property="og:title" content="Annonces de logements — Domi" />
    <meta
      property="og:description"
      content="Domi : annonces de logements examinées avant publication, propriétaires identifiés et contact direct en Côte d’Ivoire."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..600&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header id="site-header"></header>
    <main>
      <section class="page-head container">
        <span class="eyebrow">Catalogue</span>
        <h1>Trouvez le bien qui vous correspond.</h1>
        <p>
          Filtrez les annonces par commune, type de bien et budget. Toutes sont examinées avant
          publication.
        </p>
      </section>
      <div class="container catalog-layout">
        <aside class="filter-card">
          <h2>Filtrer</h2>
          <label
            >Recherche<input id="filter-q" type="search" placeholder="Quartier, titre…" /></label
          ><label>Commune<select id="filter-commune"></select></label
          ><label
            >Type de bien<select id="filter-type">
              <option value="">Tous les types</option>
              <option>Studio</option>
              <option>Appartement</option>
              <option>Maison</option>
              <option>Villa</option>
            </select></label
          ><label
            >Loyer maximum (FCFA)<input
              id="filter-budget"
              type="number"
              min="0"
              step="5000"
              placeholder="Sans limite" /></label
          ><label
            >Disponibilité<select id="filter-status">
              <option value="">Toutes</option>
              <option>Disponible</option>
              <option>Déjà loué</option>
            </select></label
          ><label
            >Trier par<select id="filter-sort">
              <option value="">Plus récentes</option>
              <option value="prix-asc">Prix croissant</option>
              <option value="prix-desc">Prix décroissant</option>
            </select></label
          ><button id="reset-filters" class="btn btn-outline" type="button">Réinitialiser</button>
        </aside>
        <section>
          <div class="results-head">
            <strong id="results-count">…</strong
            ><span>Informations fournies par les annonceurs</span>
          </div>
          <div id="all-listings" class="listing-grid"></div>
          <div id="empty-state" class="empty-state hidden">
            <h3>Aucune annonce ne correspond</h3>
            <p>Essayez d’élargir votre recherche ou de réinitialiser les filtres.</p>
          </div>
          <div class="load-more-wrap">
            <button id="load-more" class="btn btn-outline hidden" type="button">
              Afficher plus d’annonces
            </button>
          </div>
        </section>
      </div>
    </main>
    <footer id="site-footer"></footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/annonces.js"></script>
  </body>
</html>
