<!doctype html>
<!-- doctype : indique au navigateur que c'est une page HTML5 moderne -->
<html lang="fr">
  <!-- lang="fr" : la page est en français (lecteurs d'écran, traduction, Google) -->
  <head>
    <!-- ═══ EN-TÊTE : informations sur la page (rien de visible ici) ═══ -->

    <!-- Encodage des caractères : indispensable pour afficher les accents (é, à, ç…) -->
    <meta charset="UTF-8" />
    <!-- Sur téléphone : la largeur de la page = la largeur de l'écran (pas de zoom arrière) -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- SÉCURITÉ : politique de contenu (CSP). Le navigateur refuse tout script, style ou
         connexion qui ne vient pas des adresses listées ici. Une injection de code par un
         pirate (dans une annonce par exemple) est donc bloquée.
         v7.1 (audit 2026-11-18) : seuls le fichier exact de la librairie Supabase et NOTRE projet Supabase
         sont autorisés (avant : tout jsDelivr et tous les projets Supabase du monde). ⚠ Si le projet
         Supabase change, remplacer « mplbhzqmffaywlhbxleb » dans cette ligne, sur chaque page. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://mplbhzqmffaywlhbxleb.supabase.co; connect-src 'self' https://mplbhzqmffaywlhbxleb.supabase.co; manifest-src 'self'; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <!-- SÉCURITÉ : quand un visiteur quitte Domi par un lien, le site visité ne voit que
         « domi » et pas l'adresse complète de la page (qui peut contenir un identifiant) -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Couleur de la barre du navigateur sur Android (vert Domi) -->
    <meta name="theme-color" content="#0B3B35" />
    <!-- Titre affiché dans l'onglet et dans les résultats Google -->
    <title>Annonce de logement à louer — Domi</title>
    <!-- Résumé affiché par Google sous le titre -->
    <meta name="description" content="Photos, loyer, avance, caution et contact WhatsApp de l’annonceur. Visitez toujours le logement avant de payer quoi que ce soit." />

    <!-- Aperçu quand le lien est partagé sur WhatsApp / Facebook (protocole « Open Graph ») -->
    <meta property="og:title" content="Annonce de logement à louer — Domi" />
    <meta property="og:description" content="Photos, loyer, avance, caution et contact WhatsApp de l’annonceur. Visitez toujours le logement avant de payer quoi que ce soit." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Domi" />
    <meta property="og:image" content="https://levi-akoute.github.io/domi/assets/img/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Même aperçu, en grand, sur X (Twitter) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Annonce de logement à louer — Domi" />
    <meta name="twitter:description" content="Photos, loyer, avance, caution et contact WhatsApp de l’annonceur. Visitez toujours le logement avant de payer quoi que ce soit." />

    <!-- Icône de l'onglet (logo Domi en SVG : net à toutes les tailles) -->
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <!-- Icône utilisée par l'iPhone quand on ajoute Domi à l'écran d'accueil -->
    <link rel="apple-touch-icon" href="assets/img/icon-180.png" />
    <!-- Manifeste : nom, icônes et couleurs de l'application installable (PWA) -->
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- Polices Google : « preconnect » ouvre la connexion à l'avance (affichage plus rapide) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fraunces (titres, élégante) et Manrope (texte, très lisible) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..600&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Notre feuille de style (toute l'apparence du site) -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ═══ CORPS : tout ce qui est visible ═══ -->

    <!-- En-tête (logo + menu) : vide ici, construit par renderChrome() dans js/utils.js
         pour ne pas répéter le menu dans les 15 pages -->
    <header id="site-header"></header>

    <!-- Contenu principal : toute la fiche est construite par js/detail.js
         à partir de l'identifiant présent dans l'adresse (maison-detail.html?id=…) -->
    <main class="container detail-main" id="detail-content">
      <!-- Texte affiché pendant le chargement (remplacé ensuite) -->
      <p class="muted">Chargement de l’annonce…</p>
    </main>

    <!-- Pied de page : vide ici, construit lui aussi par js/utils.js -->
    <footer id="site-footer"></footer>

    <!-- ═══ SCRIPTS : placés en bas pour que la page s'affiche avant d'être rendue interactive.
         L'ORDRE COMPTE : chaque fichier utilise ceux chargés avant lui. ═══ -->

    <!-- 1. Librairie officielle Supabase (dialogue avec la base de données).
         integrity = empreinte SRI : si quelqu'un modifiait ce fichier sur le CDN,
         le navigateur refuserait de l'exécuter (protection contre un CDN piraté). -->
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"
      integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug"
      crossorigin="anonymous"
    ></script>
    <!-- 2. Réglages : adresse de la base, numéro du support, communes -->
    <script src="js/config.js"></script>
    <!-- 3. Boîte à outils commune : menu, pied de page, favoris, sécurité, installation -->
    <script src="js/utils.js"></script>
    <!-- 4. Couche de données : toutes les requêtes vers la base -->
    <script src="js/storage.js"></script>
    <!-- 5. Comptes : connexion, inscription, utilisateur courant -->
    <script src="js/auth.js"></script>
    <!-- Script propre à cette page -->
    <script src="js/detail.js"></script>
  </body>
</html>
